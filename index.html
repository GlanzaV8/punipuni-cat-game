<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぷにぷに肉球バトル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
        
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #fff1f2;
            background-image: radial-gradient(#fda4af 2px, transparent 2px);
            background-size: 24px 24px;
            overflow: hidden; /* スケール方式のためスクロールは完全禁止 */
            touch-action: none;
            user-select: none;
            color: #881337;
            margin: 0;
            padding: 0;
        }

        #game-canvas {
            background-color: #ffffff;
            border: 6px solid #f9a8d4;
            box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.6);
        }

        .key-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            background-color: #fff;
            border: 2px solid #e5e7eb;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            color: #4b5563;
            box-shadow: 0 3px 0 #e5e7eb;
            min-width: 40px;
            text-align: center;
        }

        .btn-start {
            background: linear-gradient(to bottom, #f472b6, #db2777);
            border-bottom: 4px solid #9d174d;
            border-radius: 9999px;
            color: white;
            font-weight: bold;
            transition: all 0.1s;
        }
        .btn-start:active {
            transform: translateY(2px) scale(1.05) !important;
            border-bottom: 2px solid #9d174d;
        }

        /* リザルト画面・ポーズ画面モーダル */
        #result-modal, #pause-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            border-radius: 32px;
        }
        
        #result-modal.show, #pause-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .rank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 80%;
            max-width: 350px;
            background: white;
            padding: 10px 20px;
            margin: 6px 0;
            border-radius: 50px;
            border: 2px solid #fbcfe8;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: bold;
            color: #4b5563;
            transition: transform 0.2s;
        }
        
        .rank-1 {
            background: linear-gradient(to right, #fff7ed, #fffbeb);
            border-color: #fbbf24;
            transform: scale(1.15);
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(251, 191, 36, 0.3);
            z-index: 5;
        }
        
        .rank-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
            font-size: 1rem;
        }

        /* フィーバー時の点滅アニメーション用クラス */
        @keyframes fever-blink {
            0% { border-color: #f9a8d4; box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.6); }
            50% { border-color: #ef4444; box-shadow: 0 0 30px 10px rgba(239, 68, 68, 0.8); }
            100% { border-color: #f9a8d4; box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.6); }
        }
        .fever-mode {
            animation: fever-blink 0.5s infinite;
        }
    </style>
</head>
<body class="w-screen h-screen flex justify-center items-center">

    <!-- 画面サイズに合わせて全体をズームするためのラッパー -->
    <div id="game-wrapper" class="absolute inset-0 w-full h-full flex justify-center items-center overflow-hidden">
        
        <!-- 固定サイズのゲームコンテナ (1100x550)。これが画面にフィットするように自動縮小・拡大される -->
        <div id="game-container" class="relative flex flex-col items-center gap-4" style="width: 1100px; height: 550px; transform-origin: center center;">
            
            <!-- タイマーとトップスコア -->
            <div class="w-full grid grid-cols-3 px-4 items-center shrink-0">
                <!-- 左側：メニューボタンと音量表示 -->
                <div class="flex justify-start items-center gap-4">
                    <button id="pause-btn" class="hidden text-xl bg-white hover:bg-gray-100 text-gray-700 px-6 py-2 rounded-full font-bold shadow-sm transition-all border-2 border-gray-200">
                        ⚙️ メニュー (Esc)
                    </button>
                    <div id="volume-display" class="text-gray-500 bg-white px-4 py-2 rounded-full border-2 border-gray-200 shadow-sm font-bold text-lg whitespace-nowrap">
                        🔊 50%
                    </div>
                </div>
                <!-- 中央：タイマー -->
                <div class="flex justify-center">
                    <div id="timer-display" class="text-pink-500 bg-white px-8 py-2 rounded-full border-2 border-pink-200 shadow-sm transition-all duration-300 font-bold text-3xl whitespace-nowrap">⏰ 残り: 90秒</div>
                </div>
                <!-- 右側：トップスコア -->
                <div class="flex justify-end">
                    <div id="score-display-top" class="text-yellow-500 bg-white px-8 py-2 rounded-full border-2 border-yellow-200 shadow-sm font-bold text-3xl whitespace-nowrap">👑 Top: 0pt</div>
                </div>
            </div>

            <!-- メインコンテンツ (UI + キャンバス + UI) -->
            <div class="flex flex-row justify-center items-center gap-6 w-full">
                
                <!-- 左側UI (1P, 3P) -->
                <div class="flex flex-col justify-between w-[120px] h-[450px] shrink-0">
                    <div class="bg-white border-b-4 border-green-300 rounded-xl p-3 shadow-sm flex flex-col items-center transform transition-transform hover:scale-105 h-[48%] justify-center">
                        <div class="text-green-500 font-black text-3xl mb-1 text-center leading-none">1P</div>
                        <span id="score-p1" class="text-green-600 font-bold text-4xl mt-1">0pt</span>
                    </div>
                    <div class="bg-white border-b-4 border-blue-300 rounded-xl p-3 shadow-sm flex flex-col items-center transform transition-transform hover:scale-105 h-[48%] justify-center">
                        <div class="text-blue-400 font-black text-3xl mb-1 text-center leading-none">3P</div>
                        <span id="score-p3" class="text-blue-500 font-bold text-4xl mt-1">0pt</span>
                    </div>
                </div>

                <!-- キャンバスエリア (固定サイズ 800x450) -->
                <div class="relative w-[800px] h-[450px] shrink-0">
                    <canvas id="game-canvas" width="800" height="450" class="w-full h-full rounded-[32px] shadow-lg block"></canvas>
                    
                    <!-- スタートボタン -->
                    <div id="start-btn-container" class="absolute w-full flex justify-center z-20 pointer-events-none" style="top: 80%;">
                        <button id="start-btn" class="pointer-events-auto btn-start py-3 px-12 shadow-lg text-2xl tracking-wider hover:scale-105 transform transition">
                            ゲームスタート！
                        </button>
                    </div>

                    <!-- リザルト画面 -->
                    <div id="result-modal">
                        <h2 class="text-6xl font-bold text-pink-500 mb-4 drop-shadow-sm">🎉 結果発表 🎉</h2>
                        <p class="text-gray-500 mb-8 font-bold text-2xl">おつかれさまでしたニャ！</p>
                        
                        <div id="ranking-list" class="w-full flex flex-col items-center mb-10 scale-125 origin-top">
                            <!-- JSでランキングをここに生成 -->
                        </div>
                        
                        <button id="retry-btn" class="btn-start py-3 px-12 shadow-lg text-2xl tracking-wider hover:scale-105 transform transition">
                            もう一度あそぶ！
                        </button>
                    </div>

                    <!-- ポーズ（Escメニュー）画面 -->
                    <div id="pause-modal">
                        <h2 class="text-5xl font-bold text-pink-500 mb-6 drop-shadow-sm">⏸ メニュー</h2>
                        
                        <div class="bg-pink-50 p-6 rounded-2xl max-w-xl w-[90%] text-gray-700 shadow-inner mb-8 text-lg">
                            <h3 class="font-bold text-2xl mb-4 text-pink-600 border-b-2 border-pink-200 pb-2">🎮 操作方法</h3>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div class="flex items-center gap-2"><span class="font-bold text-green-500 w-24">1P(左上)</span>: <span class="key-badge">Q</span> または タップ</div>
                                <div class="flex items-center gap-2"><span class="font-bold text-red-500 w-24">2P(右上)</span>: <span class="key-badge">R</span> または タップ</div>
                                <div class="flex items-center gap-2"><span class="font-bold text-blue-500 w-24">3P(左下)</span>: <span class="key-badge">U</span> または タップ</div>
                                <div class="flex items-center gap-2"><span class="font-bold text-orange-500 w-24">4P(右下)</span>: <span class="key-badge">P</span> または タップ</div>
                            </div>
                            <ul class="list-disc pl-5 space-y-2 text-gray-600 font-bold text-base">
                                <li>ネズミが近づいたらタイミングよく攻撃しよう！</li>
                                <li>【通常ネズミ】 Perfect <span class="text-pink-500">+2pt</span> / Good <span class="text-blue-500">+1pt</span></li>
                                <li>【金ネズミ】 Perfect <span class="text-pink-500">+10pt</span> / Good <span class="text-blue-500">+5pt</span></li>
                                <li>音量調整: <span class="key-badge scale-75 origin-left">↑</span> <span class="key-badge scale-75 origin-left">↓</span> キー</li>
                            </ul>
                        </div>

                        <div class="flex gap-8">
                            <button id="resume-btn" class="btn-start py-3 px-8 shadow-lg text-xl tracking-wider hover:scale-105 transform transition">
                                ゲームに戻る
                            </button>
                            <button id="quit-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-3 px-8 rounded-full shadow-lg text-xl tracking-wider hover:scale-105 transform transition border-b-4 border-gray-400">
                                やめる
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 右側UI (2P, 4P) -->
                <div class="flex flex-col justify-between w-[120px] h-[450px] shrink-0">
                    <div class="bg-white border-b-4 border-red-300 rounded-xl p-3 shadow-sm flex flex-col items-center transform transition-transform hover:scale-105 h-[48%] justify-center">
                        <div class="text-red-400 font-black text-3xl mb-1 text-center leading-none">2P</div>
                        <span id="score-p2" class="text-red-500 font-bold text-4xl mt-1">0pt</span>
                    </div>
                    <div class="bg-white border-b-4 border-orange-300 rounded-xl p-3 shadow-sm flex flex-col items-center transform transition-transform hover:scale-105 h-[48%] justify-center">
                        <div class="text-orange-400 font-black text-3xl mb-1 text-center leading-none">4P</div>
                        <span id="score-p4" class="text-orange-500 font-bold text-4xl mt-1">0pt</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --------------------------------------------------------
        // ウィンドウサイズに合わせて全体をズームするレスポンシブ処理
        // --------------------------------------------------------
        function adjustScale() {
            const wrapper = document.getElementById('game-wrapper');
            const container = document.getElementById('game-container');
            
            const targetWidth = 1100;
            const targetHeight = 550;
            
            const scaleX = wrapper.clientWidth / targetWidth;
            const scaleY = wrapper.clientHeight / targetHeight;
            
            // 画面に収まるように小さい方のスケールを採用 (95%にして少しだけ余裕を持たせる)
            const scale = Math.min(scaleX, scaleY) * 0.95;
            
            container.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', adjustScale);
        adjustScale(); // 初期化時にも実行

        // --------------------------------------------------------
        // ゲームロジック
        // --------------------------------------------------------
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const timerDisplay = document.getElementById('timer-display');
        const scoreDisplayTop = document.getElementById('score-display-top');
        const startBtn = document.getElementById('start-btn');
        const startBtnContainer = document.getElementById('start-btn-container');
        const pauseBtn = document.getElementById('pause-btn');
        const resultModal = document.getElementById('result-modal');
        const pauseModal = document.getElementById('pause-modal');
        const resumeBtn = document.getElementById('resume-btn');
        const quitBtn = document.getElementById('quit-btn');
        const rankingList = document.getElementById('ranking-list');
        const retryBtn = document.getElementById('retry-btn');
        const volumeDisplay = document.getElementById('volume-display');
        
        const scoreDisplays = [
            document.getElementById('score-p1'),
            document.getElementById('score-p2'),
            document.getElementById('score-p3'),
            document.getElementById('score-p4')
        ];

        let masterVolume = 0.5;

        // BGM/SE設定
        const titleBgm = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E3%83%9F%E3%83%8B%E3%83%9E%E3%83%AB%E3%83%BC%E3%83%A0.mp3');
        titleBgm.loop = true;
        titleBgm.volume = masterVolume;

        const bgm = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E3%81%AE%E3%82%93%E3%81%8D%E3%81%AA%E6%97%A5%E5%B8%B8.mp3');
        bgm.loop = true;
        bgm.volume = masterVolume; 

        const resultBgm = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E7%8C%AB%E7%8C%AB%E3%82%AE%E3%83%A3%E3%83%A9%E3%82%AF%E3%82%B7%E3%83%BC.mp3');
        resultBgm.loop = true;
        resultBgm.volume = masterVolume;

        const meowSound = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/11L-cat_meow-22753820.mp3');
        const cheerSound = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E6%AD%93%E5%A3%B0%E3%81%A8%E6%8B%8D%E6%89%8B1.mp3');
        const sirenSound = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/Warning-Siren04-05(High-Mid).mp3');
        cheerSound.volume = masterVolume;
        sirenSound.volume = masterVolume;

        const count3Sound = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/num003_02_01d.wav');
        const count2Sound = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/num002_02_01d.wav');
        const count1Sound = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/num001_02_01.wav');
        const startSound = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E9%9F%BF%E3%81%8D%E6%B8%A1%E3%82%8B%E3%83%9B%E3%82%A4%E3%83%83%E3%82%B9%E3%83%AB%EF%BC%91.mp3');
        const finishCountdownSound = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/321sokomade_01.wav');
        
        count3Sound.volume = masterVolume;
        count2Sound.volume = masterVolume;
        count1Sound.volume = masterVolume;
        startSound.volume = masterVolume;
        finishCountdownSound.volume = Math.min(1.0, masterVolume * 2.0);

        function setVolume(v) {
            masterVolume = Math.max(0.0, Math.min(1.0, v));
            titleBgm.volume = masterVolume;
            bgm.volume = masterVolume;
            resultBgm.volume = masterVolume;
            cheerSound.volume = masterVolume;
            sirenSound.volume = masterVolume;
            count3Sound.volume = masterVolume;
            count2Sound.volume = masterVolume;
            count1Sound.volume = masterVolume;
            startSound.volume = masterVolume;
            finishCountdownSound.volume = Math.min(1.0, masterVolume * 2.0);
            
            // 音量表示のUI更新
            const volPercent = Math.round(masterVolume * 100);
            let icon = '🔊';
            if (volPercent === 0) icon = '🔇';
            else if (volPercent < 50) icon = '🔉';
            volumeDisplay.textContent = `${icon} ${volPercent}%`;

            createPointPopup(canvas.width/2, canvas.height/2 + 50, `音量: ${Math.round(masterVolume * 100)}%`, '#4b5563');
        }

        const cheeseImage = new Image();
        cheeseImage.src = 'https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E3%83%81%E3%83%BC%E3%82%BA.png';
        const sadCheeseImage = new Image();
        sadCheeseImage.src = 'https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E6%82%B2%E3%81%97%E3%82%80%E3%83%81%E3%83%BC%E3%82%BA.png';
        const titleImage = new Image();
        titleImage.src = 'https://raw.githubusercontent.com/GlanzaV8/Unigames/main/4Cat.png';

        const GAME_DURATION = 90;
        const MOUSE_SPEED_NORMAL = 2.5; 
        const MOUSE_SPEED_FEVER = 4.0; 
        const MOUSE_FLEE_SPEED = 4.5;
        
        const PUNCH_RANGE = 220; 
        const PUNCH_ANGLE = Math.PI / 2.2; 
        
        const PUNCH_COOLDOWN = 60; 
        const PUNCH_DURATION = 15; 

        let gameState = 'MENU';
        let timeLeft = GAME_DURATION;
        let animationId;
        let frameCount = 0;
        let resultTimer = null;
        
        let players = [];
        let mice = [];
        let particles = [];
        let spawnTimer = 0;
        let lastIntegerTime = GAME_DURATION; 
        let countdownValue = 3;
        let countdownLastTime = 0;

        const COLORS = {
            p1: '#86efac', 
            p2: '#fda4af', 
            p3: '#93c5fd', 
            p4: '#fdba74', 
            mouse: '#d1d5db',
            bonusMouse: '#fbbf24', 
        };

        function checkFever(t) {
            return (t <= 60 && t > 45) || (t <= 15 && t > 0);
        }

        function createPlayers() {
            const getCenterAngle = (x, y) => Math.atan2((canvas.height/2) - y, (canvas.width/2) - x);
            return [
                { id: 1, key: 'KeyQ', color: COLORS.p1, x: 70, y: 70, aimAngle: getCenterAngle(70,70), state: 'IDLE', cooldown: 0, score: 0, label: '1P' },
                { id: 2, key: 'KeyR', color: COLORS.p2, x: 730, y: 70, aimAngle: getCenterAngle(730,70), state: 'IDLE', cooldown: 0, score: 0, label: '2P' },
                { id: 3, key: 'KeyU', color: COLORS.p3, x: 70, y: 380, aimAngle: getCenterAngle(70,380), state: 'IDLE', cooldown: 0, score: 0, label: '3P' },
                { id: 4, key: 'KeyP', color: COLORS.p4, x: 730, y: 380, aimAngle: getCenterAngle(730,380), state: 'IDLE', cooldown: 0, score: 0, label: '4P' }
            ];
        }

        function initGame() {
            players = createPlayers();
            mice = [];
            particles = [];
            timeLeft = GAME_DURATION;
            lastIntegerTime = GAME_DURATION;
            spawnTimer = 0;
            frameCount = 0;
            canvas.classList.remove('fever-mode');
            timerDisplay.classList.remove('text-white', 'bg-red-500', 'opacity-0');
            timerDisplay.classList.add('text-pink-500', 'bg-white');
            bgm.playbackRate = 1.0; 
            updateUI();
        }

        // 初期表示のために一度呼び出す
        setVolume(masterVolume);

        window.addEventListener('keydown', (e) => {
            if (['KeyQ', 'KeyR', 'KeyU', 'KeyP', 'Space', 'ArrowUp', 'ArrowDown', 'Escape'].includes(e.code)) {
                e.preventDefault();
            }
            if (e.code === 'Escape') {
                togglePause();
                return;
            }
            if (e.code === 'ArrowUp') {
                setVolume(masterVolume + 0.1);
                return;
            }
            if (e.code === 'ArrowDown') {
                setVolume(masterVolume - 0.1);
                return;
            }
            if (e.repeat || gameState !== 'PLAYING') return;
            const p = players.find(player => player.key === e.code);
            if (p) attemptPunch(p);
        });

        canvas.addEventListener('mousedown', handleTouch);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTouch(e.touches[0]);
        }, {passive: false});

        function handleTouch(e) {
            if (gameState !== 'PLAYING') return;
            // 画面がスケールされていても、相対的な座標は維持される
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            let triggeredPlayer = null;
            if (x < rect.width/2 && y < rect.height/2) triggeredPlayer = players[0];
            else if (x >= rect.width/2 && y < rect.height/2) triggeredPlayer = players[1];
            else if (x < rect.width/2 && y >= rect.height/2) triggeredPlayer = players[2];
            else if (x >= rect.width/2 && y >= rect.height/2) triggeredPlayer = players[3];

            if (triggeredPlayer) attemptPunch(triggeredPlayer);
        }

        function attemptPunch(p) {
            if (p.state === 'IDLE' && p.cooldown <= 0) {
                const sound = meowSound.cloneNode();
                sound.volume = masterVolume * 0.5;
                sound.play().catch(e => console.log('SE play error:', e));

                p.state = 'PUNCHING';
                p.cooldown = PUNCH_COOLDOWN;
                p.animFrame = PUNCH_DURATION;
                
                checkPunchHit(p);
                createPunchWave(p); 
            }
        }

        function checkPunchHit(p) {
            const aimAngle = p.aimAngle;

            for (let i = mice.length - 1; i >= 0; i--) {
                const m = mice[i];
                const mx = m.x - p.x;
                const my = m.y - p.y;
                const dist = Math.sqrt(mx*mx + my*my);

                if (dist < PUNCH_RANGE) {
                    const angleToMouse = Math.atan2(my, mx);
                    let diff = angleToMouse - aimAngle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;

                    if (Math.abs(diff) < PUNCH_ANGLE / 2) {
                        // パーフェクトの判定範囲をさらに狭く厳しくする (1/4 -> 1/8)
                        const isCenter = Math.abs(diff) < PUNCH_ANGLE / 8;
                        let points = 0;
                        let text = "";
                        let textColor = m.isBonus ? '#fbbf24' : p.color;

                        if (m.isBonus) {
                            points = isCenter ? 10 : 5;
                            text = isCenter ? "Perfect! +10" : "Good! +5";
                        } else {
                            points = isCenter ? 2 : 1;
                            text = isCenter ? "Perfect! +2" : "Good! +1";
                        }
                        
                        createHitEffect(m.x, m.y, points, isCenter, textColor); 
                        p.score += points;
                        createPointPopup(p.x, p.y - 40, text, textColor);
                        
                        if (m.isBonus || isCenter) {
                            for(let k=0; k<5; k++) {
                                particles.push({
                                    type: 'star',
                                    x: m.x, y: m.y,
                                    vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                                    life: 1.5, color: '#fcd34d', decay: 0.03
                                });
                            }
                        }
                        mice.splice(i, 1);
                    }
                }
            }
        }

        function spawnMouse(isBonus = false) {
            const side = Math.floor(Math.random() * 4);
            let startX, startY;
            const offset = 40;

            if (side === 0) { startX = Math.random() * canvas.width; startY = -offset; }
            else if (side === 1) { startX = canvas.width + offset; startY = Math.random() * canvas.height; }
            else if (side === 2) { startX = Math.random() * canvas.width; startY = canvas.height + offset; }
            else { startX = -offset; startY = Math.random() * canvas.height; }

            const isFever = checkFever(timeLeft);
            const currentSpeed = isFever ? MOUSE_SPEED_FEVER : MOUSE_SPEED_NORMAL;

            mice.push({
                x: startX, y: startY,
                startX: startX, startY: startY,
                state: 'APPROACHING', 
                waitTimer: 0,
                color: isBonus ? COLORS.bonusMouse : COLORS.mouse, 
                isBonus: isBonus,
                angle: 0,
                speed: currentSpeed
            });
        }

        function update() {
            frameCount++;
            if (timeLeft > 0) {
                timeLeft -= 1/60;
                const currentIntegerTime = Math.ceil(timeLeft);
                
                if (currentIntegerTime < lastIntegerTime) {
                    if (currentIntegerTime === 60 || currentIntegerTime === 15) {
                        createPointPopup(canvas.width/2, canvas.height/2, "FEVER TIME!!", "#ef4444");
                        canvas.classList.add('fever-mode');
                        timerDisplay.classList.replace('text-pink-500', 'text-white');
                        timerDisplay.classList.replace('bg-white', 'bg-red-500');
                        bgm.playbackRate = 1.5; 
                        sirenSound.currentTime = 0;
                        sirenSound.play().catch(e => console.log('Audio play error:', e));
                    } 
                    else if (currentIntegerTime === 45) {
                        canvas.classList.remove('fever-mode');
                        timerDisplay.classList.replace('text-white', 'text-pink-500');
                        timerDisplay.classList.replace('bg-red-500', 'bg-white');
                        bgm.playbackRate = 1.0; 
                    }
                    else if (currentIntegerTime === 3) {
                        finishCountdownSound.currentTime = 0;
                        finishCountdownSound.play().catch(e => console.log('Audio play error:', e));
                    }
                    else if (currentIntegerTime % 10 === 0 && currentIntegerTime !== GAME_DURATION && currentIntegerTime !== 0 && !checkFever(currentIntegerTime)) {
                        spawnMouse(true); 
                        createPointPopup(canvas.width/2, canvas.height/2, "GOLD RUSH!", "#fbbf24");
                    }
                }
                lastIntegerTime = currentIntegerTime;
                if (timeLeft <= 0) { timeLeft = 0; endGame(); }
            }
            
            spawnTimer++;
            const isFever = checkFever(timeLeft);
            let spawnInterval = Math.max(15, 80 - (GAME_DURATION - timeLeft));
            if (isFever) spawnInterval = 4;

            if (spawnTimer > spawnInterval) {
                const bonusChance = isFever ? (Math.random() < 0.1) : false;
                spawnMouse(bonusChance);
                spawnTimer = 0;
            }

            players.forEach(p => {
                if (p.cooldown > 0) p.cooldown--;
                if (p.animFrame > 0) {
                    p.animFrame--;
                    if (p.animFrame <= 0) p.state = 'IDLE';
                }

                let closestMouse = null;
                let minDist = Infinity;

                mice.forEach(m => {
                    const dx = m.x - p.x;
                    const dy = m.y - p.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < minDist) {
                        minDist = dist;
                        closestMouse = m;
                    }
                });

                p.targetMouse = closestMouse;
                if (closestMouse) {
                    p.aimAngle = Math.atan2(closestMouse.y - p.y, closestMouse.x - p.x);
                } else {
                    p.aimAngle = Math.atan2((canvas.height/2) - p.y, (canvas.width/2) - p.x);
                }
            });

            for (let i = mice.length - 1; i >= 0; i--) {
                const m = mice[i];
                if (m.state === 'APPROACHING') {
                    const dx = (canvas.width/2) - m.x;
                    const dy = (canvas.height/2) - m.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    m.angle = Math.atan2(dy, dx);

                    if (dist < 15) { 
                        m.state = 'WAITING';
                        m.waitTimer = 30; 
                    } else {
                        m.x += Math.cos(m.angle) * m.speed;
                        m.y += Math.sin(m.angle) * m.speed;
                    }
                } else if (m.state === 'WAITING') {
                    m.waitTimer--;
                    if (m.waitTimer <= 0) {
                        m.state = 'FLEEING';
                        m.fleeAngle = Math.random() * Math.PI * 2;
                    }
                } else if (m.state === 'FLEEING') {
                    m.x += Math.cos(m.fleeAngle) * MOUSE_FLEE_SPEED;
                    m.y += Math.sin(m.fleeAngle) * MOUSE_FLEE_SPEED;
                    if (m.x < -50 || m.x > canvas.width+50 || m.y < -50 || m.y > canvas.height+50) {
                         mice.splice(i, 1);
                    }
                }
            }
            updateUI();
        }

        function drawBackground() {
            ctx.fillStyle = '#fff0f5'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(255, 192, 203, 0.3)';
            const cellSize = 60;
            for(let x = 0; x < canvas.width; x += cellSize) {
                ctx.fillRect(x, 0, cellSize/2, canvas.height);
            }
            for(let y = 0; y < canvas.height; y += cellSize) {
                ctx.fillRect(0, y, canvas.width, cellSize/2);
            }

            const isFever = gameState === 'PLAYING' && checkFever(timeLeft);
            if (isFever) {
                ctx.fillStyle = 'rgba(239, 68, 68, 0.1)';
                ctx.font = 'bold 100px "M PLUS Rounded 1c"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const shakeX = (Math.random() - 0.5) * 10;
                const shakeY = (Math.random() - 0.5) * 10;
                ctx.fillText('FEVER TIME!!', canvas.width/2 + shakeX, canvas.height/2 + shakeY);
            }

            const isCheeseBeingEaten = mice.some(m => m.state === 'WAITING');
            const currentCheeseImg = isCheeseBeingEaten ? sadCheeseImage : cheeseImage;

            if (currentCheeseImg.complete && currentCheeseImg.naturalWidth !== 0) {
                const maxSize = 150; 
                const ratio = Math.min(maxSize / currentCheeseImg.naturalWidth, maxSize / currentCheeseImg.naturalHeight);
                const imgWidth = currentCheeseImg.naturalWidth * ratio;
                const imgHeight = currentCheeseImg.naturalHeight * ratio;
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;
                
                let drawX = canvas.width/2 - imgWidth/2;
                let drawY = canvas.height/2 - imgHeight/2;
                if (isCheeseBeingEaten) {
                    drawX += (Math.random() - 0.5) * 4;
                    drawY += (Math.random() - 0.5) * 4;
                }
                
                ctx.drawImage(currentCheeseImg, drawX, drawY, imgWidth, imgHeight);
                ctx.restore();
            } else {
                ctx.fillStyle = '#fce7f3';
                ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 20, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#fbcfe8';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function drawCuteCat(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            
            const breathe = Math.sin(frameCount * 0.1) * 1.5;
            ctx.rotate(p.aimAngle);

            if (p.state === 'IDLE' && p.cooldown <= 0) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, PUNCH_RANGE, -PUNCH_ANGLE/2, PUNCH_ANGLE/2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.1;
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(30, 0); 
                ctx.lineTo(PUNCH_RANGE, 0);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 6]);
                ctx.globalAlpha = 0.9;
                ctx.stroke();
                ctx.setLineDash([]);

                const expectedPawX = PUNCH_RANGE * 0.6; 
                const expectedPawSize = 60; 
                const expectedToeSize = expectedPawSize * 0.45;
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = 0.15;
                ctx.beginPath(); ctx.ellipse(expectedPawX, 0, expectedPawSize, expectedPawSize * 0.85, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(expectedPawX + expectedPawSize * 0.7, -expectedPawSize * 0.9, expectedToeSize, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(expectedPawX + expectedPawSize * 1.2, -expectedPawSize * 0.35, expectedToeSize, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(expectedPawX + expectedPawSize * 1.2,  expectedPawSize * 0.35, expectedToeSize, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(expectedPawX + expectedPawSize * 0.7,  expectedPawSize * 0.9, expectedToeSize, 0, Math.PI*2); ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.globalAlpha = 0.6;
                ctx.beginPath(); ctx.ellipse(expectedPawX, 0, expectedPawSize, expectedPawSize * 0.85, 0, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(expectedPawX + expectedPawSize * 0.7, -expectedPawSize * 0.9, expectedToeSize, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(expectedPawX + expectedPawSize * 1.2, -expectedPawSize * 0.35, expectedToeSize, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(expectedPawX + expectedPawSize * 1.2,  expectedPawSize * 0.35, expectedToeSize, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(expectedPawX + expectedPawSize * 0.7,  expectedPawSize * 0.9, expectedToeSize, 0, Math.PI*2); ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#ef4444';
                ctx.globalAlpha = 0.8;
                ctx.beginPath(); 
                ctx.arc(expectedPawX, 0, 6, 0, Math.PI*2); 
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            if (p.state === 'PUNCHING') ctx.translate(15, 0);

            ctx.fillStyle = p.color;
            ctx.beginPath(); 
            ctx.ellipse(0, 0, 30 + breathe/2, 28 - breathe/2, 0, 0, Math.PI*2); 
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(10, -22 - breathe); ctx.quadraticCurveTo(28, -25, 22, -8); ctx.fill();
            ctx.moveTo(10, 22 + breathe); ctx.quadraticCurveTo(28, 25, 22, 8); ctx.fill();
            
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath(); ctx.arc(18, -16, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(18, 16, 5, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(22, -22, 9, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(22, 22, 9, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(12, -8, 7, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(12, 8, 7, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#1f2937';
            ctx.beginPath(); ctx.arc(14, -8, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(14, 8, 3, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'rgba(255,100,100,0.4)';
            ctx.beginPath(); ctx.arc(5, -15, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(5, 15, 6, 0, Math.PI*2); ctx.fill();

            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(16, -4); ctx.quadraticCurveTo(12, 0, 16, 4); ctx.stroke();

            if (p.cooldown > 0) {
                ctx.rotate(-p.aimAngle);
                ctx.fillStyle = '#60a5fa';
                ctx.beginPath();
                ctx.arc(15, -35, 6 + Math.sin(frameCount*0.5)*2, 0, Math.PI*2);
                ctx.fill();
                ctx.moveTo(15, -41); ctx.lineTo(12, -47); ctx.stroke();
            }
            ctx.restore();
        }

        function drawCuteMouse(m) {
            ctx.save();
            ctx.translate(m.x, m.y);
            
            const targetingPlayers = players.filter(p => p.targetMouse === m && p.cooldown <= 0);
            if (targetingPlayers.length > 0) {
                targetingPlayers.forEach((tp, idx) => {
                    ctx.save();
                    const s = 24 + idx * 4; 
                    const r = frameCount * 0.05 * (idx % 2 === 0 ? 1 : -1); 
                    ctx.rotate(r);
                    ctx.strokeStyle = tp.color;
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.8;
                    
                    for(let i=0; i<4; i++) {
                        ctx.beginPath();
                        ctx.moveTo(-s, -s/2);
                        ctx.lineTo(-s, -s);
                        ctx.lineTo(-s/2, -s);
                        ctx.stroke();
                        ctx.rotate(Math.PI/2);
                    }
                    ctx.restore();
                });
            }

            let angle = m.angle;
            if (m.state === 'FLEEING') angle = m.fleeAngle;
            ctx.rotate(angle);

            const hop = Math.abs(Math.sin(frameCount * (m.speed === MOUSE_SPEED_FEVER ? 0.8 : 0.4))) * 3;
            
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath(); ctx.ellipse(0, 5, 14, 10, 0, 0, Math.PI*2); ctx.fill();

            ctx.translate(0, -hop);

            ctx.strokeStyle = '#d1d5db';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-10, 0); ctx.quadraticCurveTo(-25, Math.sin(frameCount*0.3)*5, -30, 0); ctx.stroke();

            ctx.fillStyle = m.color;
            ctx.beginPath(); ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.beginPath(); ctx.arc(6, -12, 9, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, 12, 9, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fce7f3'; 
            ctx.beginPath(); ctx.arc(6, -12, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, 12, 5, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(10, -5, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, 5, 2, 0, Math.PI*2); ctx.fill();

            if (m.isBonus) {
                if (frameCount % 20 < 10) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px Arial';
                    ctx.fillText('✨', 5, -15);
                }
            } else if (m.state === 'WAITING') {
                ctx.rotate(-angle); 
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('♪', 0, -25);
            }
            ctx.restore();
        }

        function createPunchWave(p) {
            particles.push({
                type: 'paw_wave',
                x: p.x, y: p.y,
                angle: p.aimAngle,
                radius: 10,
                maxRadius: PUNCH_RANGE,
                color: p.color,
                life: 1.0,
                decay: 0.08,
                playerId: p.id 
            });
        }

        function createHitEffect(x, y, points, isPerfect = false, color = '#f43f5e') {
            const count = isPerfect ? 8 : 3;
            const speedMult = isPerfect ? 1.5 : 1.0;
            for(let i=0; i<count; i++) {
                particles.push({
                    type: 'point_particle',
                    text: `+${points}`,
                    x: x, y: y,
                    vx: (Math.random()-0.5)*5 * speedMult, 
                    vy: (Math.random()-0.5)*5 * speedMult,
                    life: 1.5, color: color,
                    decay: 0.03
                });
            }
            for(let i=0; i<4; i++) {
                particles.push({
                    type: 'star',
                    x: x, y: y,
                    vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
                    life: 1.0, color: '#fcd34d',
                    decay: 0.05
                });
            }
        }

        function createPointPopup(x, y, text, color) {
            particles.push({
                type: 'text',
                x: x, y: y,
                vx: 0, vy: -1.5,
                life: 1.5, color: color, text: text 
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                if (pt.type === 'paw_wave') {
                    pt.radius += (pt.maxRadius - pt.radius) * 0.2;
                    const player = players.find(pl => pl.id === pt.playerId);
                    if (player && player.cooldown > 0) {
                        pt.life = 1.0;
                    } else {
                        pt.life -= 0.15;
                    }
                } else if (pt.type === 'point_particle' || pt.type === 'star' || pt.type === 'text') {
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.life -= pt.decay || 0.04;
                }
                if (pt.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            drawBackground();
            mice.forEach(m => drawCuteMouse(m));

            // 肉球ウェーブエフェクト (奥)
            particles.forEach(pt => {
                if (pt.type === 'paw_wave') {
                    ctx.save();
                    ctx.translate(pt.x, pt.y);
                    ctx.rotate(pt.angle);
                    
                    ctx.beginPath();
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = pt.life * 0.15;
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, pt.radius, -PUNCH_ANGLE/2, PUNCH_ANGLE/2);
                    ctx.fill();
                    
                    const pawX = pt.radius * 0.6; 
                    const pawSize = 60 * Math.min(1.0, pt.life * 1.5); 
                    
                    ctx.globalAlpha = pt.life * 0.35; 
                    ctx.fillStyle = pt.color;
                    
                    ctx.beginPath(); 
                    ctx.ellipse(pawX, 0, pawSize, pawSize * 0.85, 0, 0, Math.PI*2); 
                    ctx.fill();

                    const toeSize = pawSize * 0.45;
                    ctx.beginPath(); ctx.arc(pawX + pawSize * 0.7, -pawSize * 0.9, toeSize, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(pawX + pawSize * 1.2, -pawSize * 0.35, toeSize, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(pawX + pawSize * 1.2,  pawSize * 0.35, toeSize, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(pawX + pawSize * 0.7,  pawSize * 0.9, toeSize, 0, Math.PI*2); ctx.fill();

                    ctx.globalAlpha = pt.life * 0.8;
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); 
                    ctx.arc(pawX, 0, 8, 0, Math.PI*2); 
                    ctx.fill();

                    ctx.restore();
                    ctx.globalAlpha = 1.0;
                }
            });

            players.forEach(p => drawCuteCat(p));

            // ポイントやテキスト (手前)
            particles.forEach(pt => {
                if (pt.type === 'point_particle') {
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = Math.min(1.0, pt.life);
                    ctx.font = 'bold 24px "M PLUS Rounded 1c"';
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 3;
                    ctx.strokeText(pt.text, pt.x, pt.y);
                    ctx.fillText(pt.text, pt.x, pt.y);
                    ctx.globalAlpha = 1.0;
                } else if (pt.type === 'star') {
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = Math.min(1.0, pt.life);
                    ctx.font = '20px Arial';
                    ctx.fillText('★', pt.x, pt.y);
                    ctx.globalAlpha = 1.0;
                } else if (pt.type === 'text') {
                    const fontSize = pt.text.includes('FEVER') ? 40 : 22;
                    ctx.font = `bold ${fontSize}px "M PLUS Rounded 1c"`;
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = Math.min(1.0, pt.life);
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 4;
                    ctx.strokeText(pt.text, pt.x, pt.y);
                    ctx.fillText(pt.text, pt.x, pt.y);
                    ctx.globalAlpha = 1.0;
                }
            });

            // メニュー画面の描画
            if (gameState === 'MENU') {
                const bounce = Math.sin(frameCount * 0.05) * 5;
                if (titleImage.complete && titleImage.naturalWidth !== 0) {
                    const maxSize = 420; 
                    const ratio = Math.min(maxSize / titleImage.naturalWidth, maxSize / titleImage.naturalHeight);
                    const imgWidth = titleImage.naturalWidth * ratio;
                    const imgHeight = titleImage.naturalHeight * ratio;
                    ctx.save();
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetY = 4;
                    ctx.drawImage(titleImage, canvas.width/2 - imgWidth/2, canvas.height/2 - imgHeight/2 + 50 + bounce, imgWidth, imgHeight);
                    ctx.restore();
                }

                ctx.save();
                ctx.font = 'bold 56px "M PLUS Rounded 1c"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const titleText = '🏆 ぷにぷに肉球バトル 🏆';
                const titleY = canvas.height/2 - 110 + bounce;

                ctx.lineWidth = 10;
                ctx.strokeStyle = 'white';
                ctx.lineJoin = 'round';
                ctx.strokeText(titleText, canvas.width/2, titleY);
                
                ctx.shadowColor = 'rgba(236, 72, 153, 0.5)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 4;
                ctx.fillStyle = '#ec4899'; 
                ctx.fillText(titleText, canvas.width/2, titleY);
                ctx.restore();
            }

            // スタートカウントダウンの描画
            if (gameState === 'COUNTDOWN') {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                if (countdownValue >= 0) {
                    const text = countdownValue > 0 ? countdownValue : "START!!";
                    const fontSize = countdownValue > 0 ? 160 : 120;
                    const elapsed = performance.now() - countdownLastTime;
                    const scale = Math.min(1, elapsed / 150) + (countdownValue > 0 ? Math.sin(elapsed / 100) * 0.05 : 0);
                    
                    ctx.translate(canvas.width/2, canvas.height/2);
                    ctx.scale(scale, scale);
                    ctx.font = `bold ${fontSize}px "M PLUS Rounded 1c"`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.lineWidth = 20;
                    ctx.strokeStyle = 'white';
                    ctx.lineJoin = 'round';
                    ctx.strokeText(text, 0, 0);
                    ctx.fillStyle = '#ec4899'; 
                    ctx.fillText(text, 0, 0);
                }
                ctx.restore();
            }

            // 終了直前カウントダウン(3,2,1)の描画
            if (gameState === 'PLAYING' && timeLeft <= 3 && timeLeft > 0) {
                ctx.save();
                const count = Math.ceil(timeLeft);
                const fraction = timeLeft % 1; 
                const elapsed = fraction === 0 ? 0 : 1 - fraction; 
                const scale = 1 + (1 - elapsed) * 0.3; 
                
                ctx.translate(canvas.width/2, canvas.height/2);
                ctx.scale(scale, scale);
                ctx.globalAlpha = 0.4 + (1 - elapsed) * 0.4; 
                ctx.font = `bold 200px "M PLUS Rounded 1c"`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineWidth = 24;
                ctx.strokeStyle = 'white';
                ctx.lineJoin = 'round';
                ctx.strokeText(count, 0, 0);
                ctx.fillStyle = '#ef4444'; 
                ctx.fillText(count, 0, 0);
                ctx.restore();
            }

            // そこまで！の描画
            if (gameState === 'FINISHED') {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.translate(canvas.width/2, canvas.height/2);
                ctx.font = `bold 120px "M PLUS Rounded 1c"`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.lineWidth = 24;
                ctx.strokeStyle = 'white';
                ctx.lineJoin = 'round';
                ctx.strokeText("そこまで！", 0, 0);
                ctx.fillStyle = '#ef4444'; 
                ctx.fillText("そこまで！", 0, 0);
                ctx.restore();
            }
        }

        function updateUI() {
            timerDisplay.textContent = `⏰ 残り: ${Math.ceil(timeLeft)}秒`;
            const maxScore = Math.max(...players.map(p => p.score));
            scoreDisplayTop.textContent = `👑 Top: ${maxScore}pt`;
            players.forEach((p, index) => {
                scoreDisplays[index].textContent = `${p.score}pt`;
            });
        }

        function endGame() {
            gameState = 'FINISHED'; 
            startBtnContainer.style.display = 'none'; 
            pauseBtn.classList.add('hidden');
            canvas.classList.remove('fever-mode');
            
            bgm.pause();
            bgm.currentTime = 0;
            bgm.playbackRate = 1.0; 
            
            sirenSound.pause();
            sirenSound.currentTime = 0;
            
            let resultShown = false;
            
            const showResult = () => {
                if (resultShown || gameState !== 'FINISHED') return;
                resultShown = true;
                gameState = 'GAMEOVER';
                timerDisplay.classList.add('opacity-0');
                
                cheerSound.currentTime = 0;
                cheerSound.play().catch(e => console.log('Cheer play error:', e));

                resultBgm.currentTime = 0;
                resultBgm.play().catch(e => console.log('Result BGM play error:', e));

                const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
                rankingList.innerHTML = '';
                sortedPlayers.forEach((p, index) => {
                    const rank = index + 1;
                    const div = document.createElement('div');
                    div.className = `rank-item rank-${rank}`;
                    let icon = rank === 1 ? '👑 ' : '';
                    div.innerHTML = `
                        <div class="flex items-center">
                            <span class="rank-badge" style="background-color:${rank===1?'#fbbf24':'#9ca3af'}">${rank}</span>
                            <span style="color:${p.color === '#fda4af' ? '#db2777' : p.color}" class="text-xl filter drop-shadow-sm">${icon}${p.label}</span>
                        </div>
                        <span class="text-2xl">${p.score}pt</span>
                    `;
                    rankingList.appendChild(div);
                });
                resultModal.classList.add('show');

                // 紙吹雪を飛ばす演出
                const duration = 3000; // 3秒間
                const end = Date.now() + duration;

                (function frame() {
                    // 左から
                    confetti({
                        particleCount: 5,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: ['#86efac', '#fda4af', '#93c5fd', '#fdba74', '#fbbf24', '#ec4899'],
                        zIndex: 100
                    });
                    // 右から
                    confetti({
                        particleCount: 5,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: ['#86efac', '#fda4af', '#93c5fd', '#fdba74', '#fbbf24', '#ec4899'],
                        zIndex: 100
                    });

                    if (Date.now() < end && gameState === 'GAMEOVER') {
                        requestAnimationFrame(frame);
                    }
                }());
            };

            finishCountdownSound.onended = showResult;
            resultTimer = setTimeout(showResult, 2000);
        }

        function toggleGame() {
             if (gameState === 'MENU' || gameState === 'GAMEOVER') {
                titleBgm.pause();
                titleBgm.currentTime = 0;
                cheerSound.pause();
                cheerSound.currentTime = 0;
                resultBgm.pause();
                resultBgm.currentTime = 0;
                sirenSound.pause();
                sirenSound.currentTime = 0;
                finishCountdownSound.pause();
                finishCountdownSound.currentTime = 0;
                finishCountdownSound.onended = null;
                clearTimeout(resultTimer);
                if (typeof confetti !== 'undefined') confetti.reset(); // 紙吹雪をリセット

                initGame();
                gameState = 'COUNTDOWN';
                countdownValue = 3;
                countdownLastTime = performance.now();
                
                count3Sound.currentTime = 0;
                count3Sound.play().catch(e => console.log('Audio play error:', e));
                
                startBtnContainer.style.display = 'none';
                pauseBtn.classList.add('hidden');
                resultModal.classList.remove('show');
            } else {
                gameState = 'MENU';
                initGame();
            }
        }
        
        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSE';
                bgm.pause();
                pauseModal.classList.add('show');
            } else if (gameState === 'PAUSE') {
                gameState = 'PLAYING';
                bgm.play().catch(e => console.log('Audio play error:', e));
                pauseModal.classList.remove('show');
            }
        }

        retryBtn.addEventListener('click', toggleGame);
        startBtn.addEventListener('click', toggleGame);
        pauseBtn.addEventListener('click', togglePause);
        resumeBtn.addEventListener('click', togglePause);
        
        quitBtn.addEventListener('click', () => {
            pauseModal.classList.remove('show');
            gameState = 'MENU';
            initGame();
            startBtn.textContent = 'ゲームスタート！';
            startBtnContainer.style.display = 'flex';
            pauseBtn.classList.add('hidden');
            resultModal.classList.remove('show');
            bgm.pause();
            bgm.currentTime = 0;
            sirenSound.pause();
            sirenSound.currentTime = 0;
            finishCountdownSound.pause();
            finishCountdownSound.currentTime = 0;
            finishCountdownSound.onended = null;
            clearTimeout(resultTimer);
            cheerSound.pause();
            cheerSound.currentTime = 0;
            resultBgm.pause();
            resultBgm.currentTime = 0;
            if (typeof confetti !== 'undefined') confetti.reset(); // 紙吹雪をリセット
            
            // タイトルBGMを再び再生
            titleBgm.play().catch(e => console.log('Audio play error:', e));
        });

        function loop(timestamp) {
            if (!timestamp) timestamp = performance.now();

            if (gameState === 'COUNTDOWN') {
                if (timestamp - countdownLastTime >= 1000) {
                    countdownValue--;
                    countdownLastTime = timestamp;
                    
                    if (countdownValue === 2) {
                        count2Sound.currentTime = 0;
                        count2Sound.play().catch(e => console.log('Audio play error:', e));
                    } else if (countdownValue === 1) {
                        count1Sound.currentTime = 0;
                        count1Sound.play().catch(e => console.log('Audio play error:', e));
                    } else if (countdownValue === 0) {
                        startSound.currentTime = 0;
                        startSound.play().catch(e => console.log('Audio play error:', e));
                    }

                    if (countdownValue < 0) {
                        gameState = 'PLAYING';
                        if (bgm.paused) {
                            bgm.play().catch(e => console.log('Audio play error:', e));
                        }
                        pauseBtn.classList.remove('hidden');
                    }
                }
                frameCount++; 
            } else if (gameState === 'PLAYING') {
                update();
            } else if (gameState !== 'PAUSE') {
                frameCount++; 
            }
            
            if (gameState !== 'PAUSE') {
                updateParticles();
            }
            
            draw(); 
            animationId = requestAnimationFrame(loop);
        }

        initGame();
        gameState = 'MENU';
        
        // 初回ロード時の自動再生制限対策（画面クリックなどでタイトルBGM再生）
        const unlockAudio = () => {
            if (gameState === 'MENU' && titleBgm.paused) {
                titleBgm.play().catch(e => console.log('Audio play error:', e));
            }
            window.removeEventListener('click', unlockAudio);
            window.removeEventListener('keydown', unlockAudio);
            window.removeEventListener('touchstart', unlockAudio);
        };
        window.addEventListener('click', unlockAudio);
        window.addEventListener('keydown', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);

        draw();
        loop();
    </script>
</body>
</html>
